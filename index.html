<!DOCTYPE html>
<html>
    <meta charset="UTF-8" />
    <head>Blackjack Simulator</head>
    <link rel="stylesheet" href="style.css">
    <script src="./blackjack.js" defer></script>

    <div id="setup-env">
        <form id="initial-form">
            <label for="number-of-players">Choose the number of players: </label>

            <button type="submit" id="submit-player-number">Submit</button>
        </form>
    </div>

    <div id="game-env" hidden>
        <section id="dealer">

        </section>

        <section id="players">
            
        </section>
        
    </div>
</html>
